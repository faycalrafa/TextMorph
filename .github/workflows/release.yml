name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          VERSION="2.6.0"
          DATE_TAG="v$VERSION"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION }}
        run: ./gradlew assembleRelease -PappVersionName=${{ env.APP_VERSION }} --no-daemon

      - name: Prepare APK Assets
        run: |
          mkdir -p build-artifacts
          cp android-app/app/build/outputs/apk/release/app-release.apk build-artifacts/TextMorph-${{ env.RELEASE_TAG }}.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk build-artifacts/update-latest.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TextMorph-Release-APK
          path: build-artifacts/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TextMorph ${{ env.RELEASE_TAG }} (Stable)
          prerelease: false
          files: |
            build-artifacts/TextMorph-${{ env.RELEASE_TAG }}.apk
            build-artifacts/update-latest.apk
          body: |
            ### TextMorph ${{ env.RELEASE_TAG }} ✨🪄

            **TextMorph** is an on-device, privacy-first multimodal AI writing assistant, vision analyzer, and smart reply generator for Android.

            #### Features:
            - **On-Device LiteRT-LM**: Accelerated local inference with direct zero-copy mmap from Downloads/ folder.
            - **Zero-Permission Selection Mode**: Instant `ACTION_PROCESS_TEXT` integration.
            - **Floating AI & Vision Toolbar**: System-wide input overlay via Accessibility Service.
            - **Forest Clay Design System**: Deep woodland palette with full-width responsive dialogs.
            - **Localhost OpenAI Server**: Embedded Ktor HTTP server on `127.0.0.1:8080`.
            - **In-App Update System**: Direct APK download and installation from GitHub releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
