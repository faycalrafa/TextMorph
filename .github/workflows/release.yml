name: Build & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x android-app/gradlew

      - name: Determine Release Tag
        id: tag_version
        run: |
          VERSION="5.5.0"
          DATE_TAG="v$VERSION"
          echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android-app
        env:
          APP_VERSION_NAME: ${{ env.APP_VERSION }}
        run: ./gradlew assembleRelease -PappVersionName=${{ env.APP_VERSION }} --no-daemon

      - name: Prepare APK Assets
        run: |
          mkdir -p build-artifacts
          cp android-app/app/build/outputs/apk/release/app-release.apk build-artifacts/TextMorph-${{ env.RELEASE_TAG }}.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk build-artifacts/update-latest.apk

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          mkdir -p build-artifacts
          python3 -c "
          import re, sys

          version = '${{ env.APP_VERSION }}'
          notes = ''
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'##\s+\[?v?{re.escape(version)}\]?[^\n]*\n(.*?)(?=\n##\s+\[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match and match.group(1).strip():
                  notes = match.group(1).strip()
          except Exception as e:
              print(f'Warning: Could not read CHANGELOG.md: {e}', file=sys.stderr)

          if not notes:
              notes = f'### TextMorph v{version}\n\nPerformance improvements and bug fixes.'

          header = f'### TextMorph v{version} ✨🪄\n\n'
          with open('build-artifacts/RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(header + notes + '\n')
          "
          echo '=== Generated Release Notes ==='
          cat build-artifacts/RELEASE_NOTES.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TextMorph-Release-APK
          path: build-artifacts/*.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: TextMorph ${{ env.RELEASE_TAG }} (Stable)
          prerelease: false
          files: |
            build-artifacts/TextMorph-${{ env.RELEASE_TAG }}.apk
            build-artifacts/update-latest.apk
          body_path: build-artifacts/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
